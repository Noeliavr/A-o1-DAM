<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de cambio de página</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f9fb;
            margin: 0;
        }
        .mensaje {
            font-size: 2rem;
            color: #2663fb;
            text-align: center;
            padding: 2rem;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 2px 16px rgba(30,30,30,0.07);
        }
    </style>
</head>
<body>
    <div class="mensaje">
        Esto es una prueba de que funciona el cambio de página
    </div>
</body>
</html>
