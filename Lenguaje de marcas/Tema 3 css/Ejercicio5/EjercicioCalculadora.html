<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ejercicio Calculadora</title>
  <link rel="stylesheet" href="EjercicioCalculadora.css" />
</head>
<body>
  <div class="fondo">
    <div class="calculadora">
      <div class="display">
        <span class="linea-superior">AC  DEL  ÷</span>
        <span class="linea-inferior">0</span>
      </div>

      <button class="clear">AC</button>
      <button class="delete">DEL</button>
      <button class="operacion">÷</button>
      <button class="operacion">+</button>

      <button class="digito">1</button>
      <button class="digito">2</button>
      <button class="digito">3</button>
      <button class="operacion">+</button>

      <button class="digito">4</button>
      <button class="digito">5</button>
      <button class="digito">6</button>
      <button class="operacion">*</button>

      <button class="digito">7</button>
      <button class="digito">8</button>
      <button class="digito">9</button>
      <button class="operacion">-</button>

      <button class="digito">.</button>
      <button class="digito">0</button>
      <button class="boton_doble operacion">=</button>
    </div>
  </div>
</body>
</html>
